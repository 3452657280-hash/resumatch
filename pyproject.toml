[tool.poetry]
name = "resumatch"
version = "0.1.0"
description = "ResuMatch — AI Agent 简历匹配系统"
authors = []

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.115.0"
uvicorn = {extras = ["standard"], version = "^0.34.0"}
chromadb = "^0.6.0"
pymupdf = "^1.25.0"
python-docx = "^1.1.0"
httpx = "^0.28.0"
python-multipart = "^0.0.18"
pydantic = "^2.10.0"
pydantic-settings = "^2.7.0"
python-dotenv = "^1.1.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
